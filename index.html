<script>
    // gotten from https://www.xjavascript.com/blog/include-another-html-file-in-a-html-file/
    fetch('./header.html')
        .then(response => {
            if (!response.ok) throw new Error('Failed to load header.html');
            return response.text();
        })
        .then(html => {
            document.getElementById('header-container').innerHTML = html;
        })
        .catch(error => {
            console.error('Error:', error);
            document.getElementById('header-container').innerHTML = '<p>Header failed to load.</p>';
        });
</script>

<header id="header-container"></header>
